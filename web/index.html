<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Care · ghar ki khabar</title>
    <meta name="description" content="Your parents chat on WhatsApp; you see how their day is going." />
    <meta name="theme-color" content="#f7f2e8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the theme before the first paint: light unless the person chose dark or "system".
      try {
        var t = localStorage.getItem('afc_theme') || 'light';
        if (t !== 'system') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
