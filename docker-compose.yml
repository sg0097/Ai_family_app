services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: familycare
      POSTGRES_PASSWORD: familycare
      POSTGRES_DB: familycare
    ports: ["5444:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6391:6379"]
volumes:
  pgdata:
